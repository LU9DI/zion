name: Zion validation

on:
  push:
    branches: [main]
  # Stacked PRs target other feature branches; validate them too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Source has been restored; validate every push and pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZION_POSTGRES_TEST_URL: postgres://zion:zion@localhost:5432/zion_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zion
          POSTGRES_PASSWORD: zion
          POSTGRES_DB: zion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zion -d zion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository structure
        run: |
          test -f package.json
          test -d src
          test -d test
      - name: Install dependencies if lockfile exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Install PostgreSQL integration-test driver
        run: npm install --no-save --no-package-lock pg@^8.13.0
      - name: Syntax checks
        run: npm run check
      - name: Test suite including real PostgreSQL integration
        run: npm test
      - name: Demo smoke tests
        run: |
          npm run demo
          npm run client:demo
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify Rust dependency lockfile is committed
        run: test -f Cargo.lock
      - name: Test Rust storage core with locked dependencies
        run: cargo test --locked --manifest-path rust-core/Cargo.toml
      - name: Build Rust storage sidecar
        run: cargo build --locked --release --manifest-path rust-core/Cargo.toml --bin rea-storage-cli
      - name: Test real Node-to-Rust storage interoperability
        env:
          ZION_RUST_STORAGE_BIN: target/release/rea-storage-cli
        run: node --test test/rust-storage-integration.test.js
