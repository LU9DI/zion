name: Zion validation

on:
  push:
    branches: [main]
  # Stacked PRs target other feature branches; validate them too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Source has been restored; validate every push and pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZION_POSTGRES_TEST_URL: postgres://zion:zion@localhost:5432/zion_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zion
          POSTGRES_PASSWORD: zion
          POSTGRES_DB: zion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zion -d zion_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate repository structure
        run: |
          test -f package.json
          test -d src
          test -d test
      - name: Install dependencies if lockfile exists
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Install pinned PostgreSQL integration-test driver
        run: npm install --no-save --no-package-lock pg@8.23.1
      - name: Verify PostgreSQL integration-test driver version
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; if (JSON.parse(readFileSync('node_modules/pg/package.json', 'utf8')).version !== '8.23.1') process.exit(1)"
      - name: Syntax checks
        run: npm run check
      - name: Test suite including real PostgreSQL integration
        run: npm test
      - name: Demo smoke tests
        run: |
          npm run demo
          npm run client:demo
      - name: Set up Rust MSRV toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
      - name: Verify Rust minimum supported version
        run: cargo +1.89.0 test --locked --manifest-path rust-core/Cargo.toml
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Verify Rust dependency lockfile is committed
        run: test -f Cargo.lock
      - name: Test Rust storage core with locked dependencies
        run: cargo test --locked --manifest-path rust-core/Cargo.toml
      - name: Build Rust storage sidecar
        run: cargo build --locked --release --manifest-path rust-core/Cargo.toml --bin rea-storage-cli
      - name: Test real Node-to-Rust storage interoperability
        env:
          ZION_RUST_STORAGE_BIN: target/release/rea-storage-cli
        run: node --test test/rust-storage-integration.test.js


  cometbft-commit-verifier:
    name: CometBFT v0.38.26 commit verifier (test-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.11
          cache: true
          cache-dependency-path: poc/cometbft-verifier/go.mod
      - name: Verify exact CometBFT module pin
        working-directory: poc/cometbft-verifier
        run: |
          set -euo pipefail
          go version
          # One module text entry, no redirect and no suppression. The single-line
          # grep is kept so the pin stays visible to a reviewer; the module-graph
          # checks are what actually constrain the selected version.
          test "$(grep -Ec '^[[:space:]]*(require[[:space:]]+)?github\.com/cometbft/cometbft[[:space:]]' go.mod)" = "1"
          grep -Eq '^[[:space:]]*(require[[:space:]]+)?github\.com/cometbft/cometbft[[:space:]]+v0\.38\.26$' go.mod
          ! grep -Eq '^[[:space:]]*(replace|exclude)[[:space:]]' go.mod
          test "$(go list -m -f '{{.Version}}' github.com/cometbft/cometbft)" = "v0.38.26"
          test -z "$(go list -m -f '{{with .Replace}}{{.Path}}@{{.Version}}{{end}}' github.com/cometbft/cometbft)"
      - name: Resolve pinned module and generate checksum file
        working-directory: poc/cometbft-verifier
        run: go mod tidy
      - name: Verify committed module metadata is already tidy
        run: |
          git diff --exit-code -- poc/cometbft-verifier/go.mod poc/cometbft-verifier/go.sum
      - name: Preserve generated Go module lock metadata for review
        uses: actions/upload-artifact@v4
        with:
          name: cometbft-verifier-module-lock
          path: |
            poc/cometbft-verifier/go.mod
            poc/cometbft-verifier/go.sum
          if-no-files-found: error
      - name: Test commit verifier
        working-directory: poc/cometbft-verifier
        run: go test -race -count=1 ./...
      - name: Vet commit verifier
        working-directory: poc/cometbft-verifier
        run: go vet ./...

  rust-lock-platform:
    name: Rust storage lock (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust 1.89
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.89.0
      - name: Test Rust storage core and lock behavior
        run: cargo +1.89.0 test --locked --manifest-path rust-core/Cargo.toml

  clamav-integration:
    name: Real ClamAV malware-screening integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ClamAV engine and signature updater
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav clamav-freshclam
      - name: Update malware signatures
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --stdout --verbose
      - name: Verify engine and signature database
        run: |
          clamscan --version
          test -s /var/lib/clamav/daily.cvd -o -s /var/lib/clamav/daily.cld
      - name: Run real-engine EICAR and benign-file integration tests
        run: node --test test/clamav-integration.test.js
