name: CometBFT private runner network smoke

on:
  push:
    branches:
      - architecture/fully-decentralized-core
  workflow_dispatch:

concurrency:
  group: cometbft-private-runner-network-smoke
  cancel-in-progress: false

permissions:
  id-token: write

jobs:
  network-smoke:
    name: runner ${{ matrix.node }} private link
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - node: alpha
            hostname: zion-ci-alpha
            peer: zion-ci-beta
          - node: beta
            hostname: zion-ci-beta
            peer: zion-ci-alpha

    steps:
      - name: Check federated identity configuration
        id: federation
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.ZION_CI_TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.ZION_CI_TS_AUDIENCE }}
          NETWORK_SMOKE_OPT_IN: ${{ vars.ZION_ENABLE_COMETBFT_NETWORK_SMOKE }}
          ISOLATED_TAILNET_READY: ${{ vars.ZION_ISOLATED_TAILNET_READY }}
        shell: bash
        run: |
          if [[ "$NETWORK_SMOKE_OPT_IN" == "true" && "$ISOLATED_TAILNET_READY" == "true" && -n "$TS_OAUTH_CLIENT_ID" && -n "$TS_AUDIENCE" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Private runner network: NOT RUN"
              echo
              echo "No ephemeral tailnet node was created and no network test was attempted."
              echo "The isolated-tailnet readiness gate, explicit opt-in, or restricted Tailscale OIDC identity is not configured. No tailnet node was created."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Join the restricted ephemeral Tailscale network
        if: steps.federation.outputs.configured == 'true'
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.ZION_CI_TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.ZION_CI_TS_AUDIENCE }}
          tags: tag:zion-ci
          hostname: ${{ matrix.hostname }}
          ping: ${{ matrix.peer }}
          version: 1.104.4
          timeout: 3m
          retry: 5

      - name: Verify private TCP connectivity in this direction
        if: steps.federation.outputs.configured == 'true'
        env:
          PEER_HOST: ${{ matrix.peer }}
        shell: bash
        run: |
          python3 - <<'PY'
          import http.client
          import ipaddress
          import socket
          import subprocess
          import threading
          import time
          from http.server import BaseHTTPRequestHandler, HTTPServer

          PORT = 26656
          PAYLOAD = b"zion-ci-private-network-smoke-v1"
          TAILSCALE_V4 = ipaddress.ip_network("100.64.0.0/10")
          peer = __import__("os").environ["PEER_HOST"]

          local_ip = ipaddress.ip_address(
              subprocess.check_output(["tailscale", "ip", "-4"], text=True).strip()
          )
          if local_ip not in TAILSCALE_V4:
              raise SystemExit("Local Tailscale IPv4 address is outside 100.64.0.0/10")

          class HealthHandler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path != "/health":
                      self.send_error(404)
                      return
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(PAYLOAD)))
                  self.end_headers()
                  self.wfile.write(PAYLOAD)

              def log_message(self, *_args):
                  pass

          server = HTTPServer((str(local_ip), PORT), HealthHandler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          try:
              deadline = time.monotonic() + 180
              last_error = "peer did not respond"
              while time.monotonic() < deadline:
                  try:
                      infos = socket.getaddrinfo(peer, PORT, socket.AF_INET, socket.SOCK_STREAM)
                      addresses = sorted({item[4][0] for item in infos})
                      if not addresses:
                          raise RuntimeError("MagicDNS returned no IPv4 address")
                      if any(ipaddress.ip_address(addr) not in TAILSCALE_V4 for addr in addresses):
                          raise RuntimeError("Peer DNS resolved outside the Tailscale IPv4 range")

                      connected = False
                      for address in addresses:
                          connection = http.client.HTTPConnection(address, PORT, timeout=5)
                          try:
                              connection.request("GET", "/health", headers={"Host": peer})
                              response = connection.getresponse()
                              body = response.read(128)
                              if response.status == 200 and body == PAYLOAD:
                                  connected = True
                                  break
                              raise RuntimeError("Peer returned an unexpected health response")
                          finally:
                              connection.close()

                      if connected:
                          print(f"Private TCP connectivity verified: {peer}:{PORT}")
                          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                              summary.write(
                                  f"## Private runner network: PASS ({__import__('os').environ['PEER_HOST']})\n\n"
                                  f"TCP {PORT} reached the peer's fixed health responder over its Tailscale IPv4 address.\n"
                              )
                          break
                  except Exception as exc:
                      last_error = str(exc)
                      time.sleep(3)
              else:
                  raise SystemExit(f"Private network check timed out: {last_error}")
          finally:
              server.shutdown()
              server.server_close()
          PY

      - name: Report skipped network test
        if: steps.federation.outputs.configured != 'true'
        run: echo "Network test skipped; no credentials were available."